# Sobe um MySQL local já com as tabelas de bdEmbaixada.sql.
# Uso: docker compose up -d  (se a porta 3306 já estiver em uso: MYSQL_PORT=3307 docker compose up -d)
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: embaixadaBrasil
      MYSQL_USER: embaixada
      MYSQL_PASSWORD: embaixada
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./bdEmbaixada.sql:/docker-entrypoint-initdb.d/bdEmbaixada.sql:ro
      - dados:/var/lib/mysql

volumes:
  dados:
